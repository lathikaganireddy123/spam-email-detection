<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spam Email Detection</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow-x: hidden; /* 🔥 FIX */
        }

        /* 🔥 MAIN LAYOUT */
        .main {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* 🔥 LEFT IMAGE */
        .left {
            flex: 1.2;
            background-image: url("{{ url_for('static', filename='images/bg2.png') }}");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        /* 🔥 MIDDLE BORDER */
        .divider {
            width: 4px;
            background: rgba(0, 0, 0, 0.15);
        }

        /* 🔥 RIGHT FORM AREA */
        .right {
            flex: 1;
            background: #f4f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔥 FORM CONTAINER */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px; /* 🔥 FIX */
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            animation: slideIn 0.8s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 🔥 TITLE ALIGNMENT */
        .title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .title h1 {
            margin: 0;
            font-size: 26px;
            color: #333;
        }

        .icon {
            font-size: 28px;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        /* 🔥 SHINY BUTTON */
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 255, 255, 0.5),
                transparent
            );
            animation: shine 2.5s infinite;
        }

        @keyframes shine {
            0% { left: -75%; }
            100% { left: 125%; }
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102,126,234,0.8),
                        0 0 30px rgba(102,126,234,0.5);
        }

        button:active {
            transform: scale(0.97);
        }

        /* 🔥 RESULT */
        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .spam {
            background: #ffe5e5;
            color: #c0392b;
        }

        .not-spam {
            background: #e5ffe9;
            color: #27ae60;
        }

        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }

        /* 🔥 MOBILE RESPONSIVE */
        @media (max-width: 768px) {

            .main {
                flex-direction: column;
                height: auto;
            }

            .left {
                height: 30vh;
                background-size: contain;
            }
            .left {
    background-repeat: no-repeat;
    background-position: center;
                  }
 
            .divider {
                width: 100%;
                height: 3px;
            }

            .right {
                padding: 20px 10px;
            }

            .container {
                padding: 25px;
                margin: 10px auto;
            }

            .title h1 {
                font-size: 22px;
            }

            .icon {
                font-size: 24px;
            }

            textarea {
                height: 100px;
            }

            button {
                font-size: 15px;
                padding: 11px;
            }
        }

        /* 🔥 VERY SMALL PHONES */
        @media (max-width: 480px) {
            .left {
                display: none;
            }
        }

        /* 🔥 IMAGE RESPONSIVENESS FIX */

/* Desktop & large screens */
@media (min-width: 1024px) {
    .left {
        background-size: cover;
    }
}

/* Tablets */
@media (max-width: 1023px) and (min-width: 769px) {
    .left {
        background-size: contain;
    }
}

/* Mobile phones */
@media (max-width: 768px) {
    .left {
        height: 30vh;
        background-size: contain;
        background-position: center;
    }
}

/* Very small phones */
@media (max-width: 480px) {
    .left {
        height: 25vh;
        background-size: contain;
    }
}


    </style>
</head>

<body>

<div class="main">

    <div class="left"></div>

    <div class="divider"></div>

    <div class="right">
        <div class="container">

            <div class="title">
                <span class="icon">📧</span>
                <h1>Spam Email Detection</h1>
            </div>

            <p>Enter your email/message below to check if it is spam</p>

            <form method="POST">
                <textarea name="message" placeholder="Type your email or message here..." required></textarea>
                <button type="submit">Check Message</button>
            </form>

            {% if result %}
                {% if "Spam" in result %}
                    <div class="result spam">🚫 {{ result }}</div>
                {% else %}
                    <div class="result not-spam">✅ {{ result }}</div>
                {% endif %}
            {% endif %}

            <footer>Machine Learning Project</footer>

        </div>
    </div>

</div>

</body>
</html>
